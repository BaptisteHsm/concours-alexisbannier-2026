name: Comptage des votes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comptage
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recompter
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: python count.py

      - name: Publier le résultat
        run: |
          if git diff --quiet tally.json; then
            echo "Pas de changement."
            exit 0
          fi
          git config user.name "comptage-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tally.json
          git commit -m "Comptage $(TZ=Europe/Paris date '+%d/%m %H:%M')"
          git pull --rebase
          git push
